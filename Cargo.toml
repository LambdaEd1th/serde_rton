[package]
name = "serde_rton"
version = "0.4.0"
edition = "2024"
authors = ["ed1th"]
categories = ["encoding", "parser-implementations"]
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LambdaEd1th/serde_rton"

[features]
default = []
crypto = ["dep:hex", "dep:md-5", "dep:simple-rijndael"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
byteorder = "1.5"
regex = "1.12"
num_enum = "0.7"
integer-encoding = "4.1"
simple-rijndael = { version = "0.3", optional = true }
md-5 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
serde_json = "1.0"
serde_yaml = "0.9"

[package.metadata.docs.rs]
all-features = true
