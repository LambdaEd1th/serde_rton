[package]
name = "serde_rton"
version = "0.3.0"
edition = "2024"
authors = ["ed1th"]
categories = ["encoding", "parser-implementations"]
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/LambdaEd1th/serde_rton"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
byteorder = "1.5.0"
regex = "1.12.2"
num_enum = "0.7.5"
integer-encoding = "4.1.0"
simple-rijndael = "0.3.2"
md-5 = "0.11"
hex = "0.4.3"

serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_yaml = "0.9.33"
